- clean: ['~']

- link:
    ~/.bash_profile: bash_profile
    ~/.bashrc:
        path: bashrc
        force: true
    ~/.gitconfig:
        path: gitconfig
        force: true
    ~/.ssh/config:
        path: ssh/config
        create: true
    ~/.ssh/allowed_signers:
        path: ssh/allowed_signers
        create: true
    ~/.vimrc: vimrc
    ~/.gemrc: gemrc
    ~/.inputrc: inputrc
    ~/.config/ghostty/config:
        path: ghostty/config
        create: true
    ~/bin:
        path: bin/
        create: true
    ~/.claude/settings.json:
        path: claude/settings.json
        force: true
    ~/.claude/CLAUDE.md:
        path: claude/CLAUDE.md
        force: true
    ~/.claude/commands/prepare-pr.md:
        path: claude/commands/prepare-pr.md
        create: true
        force: true

- shell:
  - command: |
      if [[ "$(uname -s)" != "Darwin" ]]; then exit 0; fi
      if ! command -v brew &>/dev/null; then
        echo "Homebrew not found - install it first: https://brew.sh/"
        exit 1
      fi
      brew install git gh bash bash-completion rbenv ruby-build shellcheck gitleaks
    description: Installing Homebrew packages (macOS)
    stdout: true
    stderr: true
  - command: |
      if [[ "$(uname -s)" != "Darwin" ]]; then exit 0; fi
      BREW_BASH="$(brew --prefix)/bin/bash"
      if ! grep -qF "$BREW_BASH" /etc/shells; then
        echo "Adding $BREW_BASH to /etc/shells (requires sudo)..."
        sudo bash -c "echo $BREW_BASH >> /etc/shells"
      fi
      CURRENT_SHELL=$(dscl . -read /Users/$(whoami) UserShell 2>/dev/null | awk '{print $2}')
      if [[ "$CURRENT_SHELL" != "$BREW_BASH" ]]; then
        echo "Setting $BREW_BASH as default shell..."
        chsh -s "$BREW_BASH"
      else
        echo "Homebrew bash is already the default shell."
      fi
    description: Setting Homebrew bash as default shell (macOS)
    stdin: true
    stdout: true
    stderr: true
  - command: |
      if [[ "$(uname -s)" != "Linux" ]]; then exit 0; fi
      if ! command -v apt-get &>/dev/null; then exit 0; fi
      sudo apt-get update
      sudo apt-get install -y git gh bash-completion build-essential vim rbenv ruby-build shellcheck
    description: Installing apt packages (Linux/Debian)
    stdin: true
    stdout: true
    stderr: true
  - command: |
      # gitleaks isn't packaged in apt; install the official release binary (no extra PM).
      if [[ "$(uname -s)" != "Linux" ]]; then exit 0; fi
      if command -v gitleaks &>/dev/null; then exit 0; fi
      case "$(uname -m)" in x86_64) a=x64;; aarch64|arm64) a=arm64;; *) a=x64;; esac
      v=$(curl -fsSL https://api.github.com/repos/gitleaks/gitleaks/releases/latest | grep -oP '"tag_name":\s*"v\K[^"]+')
      curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${v}/gitleaks_${v}_linux_${a}.tar.gz" | tar -xz gitleaks
      sudo install gitleaks /usr/local/bin/ && rm -f gitleaks
    description: Installing gitleaks release binary (Linux)
    stdout: true
    stderr: true
